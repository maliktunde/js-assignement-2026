<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mini To-Do</title>
    <style>
        .html, body { font-family: sans-serif; background: #c8c9ca; padding: 12px; }
      .task { padding: 8px; margin: 6px 0; border: 1px solid #ccc; }
      .highlight { background: #fff3cd; border-color: #ffeeba; }
    </style>
  </head>
  <body>
    <h1>Mini To‑Do</h1>

    <button id="addBtn">Add New Item</button>

    <div style="margin-top: 12px;">
      <button id="toggleBtn">Toggle highlight</button>
      <button id="clearBtn">Clear list</button>
    </div>

    <div id="tasksContainer" style="margin-top: 12px;"></div>

    <script src="/js/app.js"></script>
  </body>
</html>
