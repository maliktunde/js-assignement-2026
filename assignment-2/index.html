<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dealer Landing Page</title>
    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Custom css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Header with Nav -->
    <header class="top-header">
        <div class="container">
            <a href="#" class="logo">
                <i class="fas fa-car"></i>
                <strong>Drive <span>Lux</span></strong>
            </a>

            <nav>
                <ul class="menu">
                    <li class="menu-item"><a href="#">Inventory</a></li>
                    <li class="menu-item"><a href="#">Financing</a></li>
                    <li class="menu-item"><a href="#">Services</a></li>
                    <li class="menu-item"><a href="#">About Us</a></li>
                </ul>
            </nav>

            <button><i class="fas fa-phone-alt"></i> Contact</button>
        </div>
    </header>

    <!-- Hero Section -->
     <section class="hero">
        <div class="container">
            <!-- hero left -->
            <div class="hero-left">
                <span><i class="fas fa-diamond"> </i> Premium Selection</span>
                <h1 class="hero-title">Where <span>style</span> meets the road</h1>
                <p>Discover a curated collection 01 luxury and performance vehicles. Every car is handpicked tor quality, Character. and driving pleasure.</p>
                <div class="hero-btn">
                    <button><i class="fas fa-search"></i> Browse cars</button>
                    <button><i class="fas fa-calendar"></i> Schedule a Test Drive</button>
                </div>
        </div>
        <!-- hero right -->
        <div class="hero-right">
            <div id="right-hero-badge"><i class="fas fa-star"></i> 2026 Collection</div>
        </div>
</body>
</html>
